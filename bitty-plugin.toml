# Bitty plugin manifest for the Search (bitty-terminal.search).
#
# W-135 S-3 (CTX-0003) public-API policy package over the accepted W-135 /
# W-131 / W-137 contracts. The plugin consumes exactly one additive v2
# capability and no private surface: `history.transcript.read` (bounded,
# scoped snapshot queries over already-persisted, already-redacted transcript
# history through `bitty.history.transcript.query` with `op` list/tail/search).
# It requests no commands history, no KV, no clipboard, no filesystem,
# process-spawn, network, overlay, or terminal authority: result export through
# `bitty.selection.copy` needs the separate `clipboard.write` grant and fails
# closed without it, and the plugin never reads `bitty.terminal.*`, never
# subscribes to streaming events, and never executes or interpolates the
# untrusted record bodies it displays.
#
# `just manifest` validates this file with the authoritative `bitty-plugin-lint`
# from bitty-plugin-sdk (history/search/selection surface, SDK PR #144 head),
# pinned by commit in `package.json` and `bun.lock`. Run `just install` once
# to materialize it.
#
# NOTE: bitty-plugin-sdk PR #144 (CTX-0066, W-139 history/search/selection
# surface) is OPEN at the pinned head SHA below, so the pin tracks that PR
# head rather than a merged release. Re-pin to the merge commit when #144
# lands; see README for the derivation.

[plugin]
id = "bitty-terminal.search"
name = "Search"
version = "0.0.1"
description = "Scrollback search policy over the public history snapshot API: bounded scoped transcript queries with typed denials, untrusted labels, result navigation, and grant-gated export. Presentation state only; never mutates Terminal Truth."
license = "MIT"

[compat]
# Application and Plugin API ranges. Both are syntax-validated here and
# resolved by the host at install time. The host validates compatibility
# before activation and fails closed (disable with a diagnostic, no partial
# activation) on mismatch.
bitty = ">=0.5,<1.0"
plugin-api = "^1.0"

[capabilities]
# Deny by default; each capability is requested one by one. This is the exact
# minimal set the search policy needs; nothing else is declared or used.
# - history.transcript.read: bounded snapshot queries (`list`/`tail`/`search`)
#   over already-persisted transcript history, always with an explicit
#   panel/workspace scope, explicit row/byte bounds, opt-in capture, typed
#   denials, and the Core-attached untrusted label (W-139, RFC-0004).
# Export (`bitty.selection.copy`) intentionally has no grant here: it needs
# the separate `clipboard.write` capability and fails closed with
# E_CAPABILITY_DENIED until that grant is added under its own review.
history.transcript.read = true

[lazy]
# Static triggers let the host register the plugin without creating a VM.
# Commands are plugin-qualified: `<plugin-id>:<resource>`. `search` runs one
# bounded snapshot query; `next`/`prev` move the cursor over the cached page;
# `clear` drops the page; `copy` exports the current match behind the separate
# clipboard grant. No event subscriptions: the plugin never streams and never
# observes the Event Bus.
commands = [
  "bitty-terminal.search:search",
  "bitty-terminal.search:next",
  "bitty-terminal.search:prev",
  "bitty-terminal.search:clear",
  "bitty-terminal.search:copy",
]
